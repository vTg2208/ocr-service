name: aranyasetu

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ocr_land
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr_land"]
      interval: 5s
      timeout: 5s
      retries: 20
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
  api:
    build: .
    image: aranyasetu-api:local
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      SECURE_UPLOAD_DIR: /var/lib/aranyasetu/private_uploads
    volumes:
      - private_uploads:/var/lib/aranyasetu/private_uploads
      - paddle_models:/root/.paddlex
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    image: aranyasetu-worker:local
    command: ["python", "-m", "scripts.run_fra_jobs", "--forever"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    environment:
      SECURE_UPLOAD_DIR: /var/lib/aranyasetu/private_uploads
    volumes:
      - private_uploads:/var/lib/aranyasetu/private_uploads
      - paddle_models:/root/.paddlex
    restart: unless-stopped
volumes:
  postgres_data:
  clamav_data:
  private_uploads:
  paddle_models:
