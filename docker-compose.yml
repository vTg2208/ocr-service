name: aranyasetu

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ocr_land
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr_land"]
      interval: 5s
      timeout: 5s
      retries: 20
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
  api:
    build: .
    image: aranyasetu-api:local
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      SECURE_UPLOAD_DIR: /var/lib/aranyasetu/private_uploads
      REDIS_URL: redis://redis:6379/0
    volumes:
      - private_uploads:/var/lib/aranyasetu/private_uploads
      - paddle_models:/root/.paddlex
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build:
      context: .
      args:
        LAND_COVER_ML: "true"
    image: aranyasetu-worker:local
    command: ["python", "-m", "scripts.run_fra_jobs", "--forever"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    environment:
      SECURE_UPLOAD_DIR: /var/lib/aranyasetu/private_uploads
      LAND_COVER_WEIGHTS_PATH: /var/lib/aranyasetu/models/dynamic_world.pt
    volumes:
      - private_uploads:/var/lib/aranyasetu/private_uploads
      - paddle_models:/root/.paddlex
      - land_cover_models:/var/lib/aranyasetu/models
    restart: unless-stopped
volumes:
  postgres_data:
  clamav_data:
  private_uploads:
  paddle_models:
  land_cover_models:
